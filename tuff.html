<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #111;
      color: #fff;
    }

    .message {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    audio {
      width: 300px;
    }
  </style>
</head>
<body>

  <div class="message">
    turn volum up and click play
  </div>

  <audio controls>
    <source src="untitled.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>

</body>
</html>
